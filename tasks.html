<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>My tasks – Taskly</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><aside class="side"><div class="brand"><span class="logo"><svg class="i" viewBox="0 0 24 24" style="stroke:#fff"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>Taskly</b></div><nav aria-label="Main"><a href="index.html"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z"/></svg><span>Dashboard</span></a><a href="tasks.html" class="on" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span>My tasks</span></a></nav><div class="side-foot" id="side-stat"></div></aside><main class="main">
<header class="top"><div><h1>My tasks</h1><p class="sub" id="count" aria-live="polite"></p></div></header>
<form class="addbar" id="add" autocomplete="off">
  <input type="text" id="nt" placeholder="What needs doing?" maxlength="200" required aria-label="New task">
  <select id="pri" aria-label="Priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
  <select id="cat" aria-label="Category"></select>
  <input type="date" id="due" aria-label="Due date">
  <button class="btn">Add task</button>
</form>
<div class="tools">
  <div class="tabs" id="tabs"><button class="on" data-f="all">All</button><button data-f="open">To do</button><button data-f="done">Done</button></div>
  <input type="search" id="q" placeholder="Search tasks" aria-label="Search tasks">
  <select id="sort" aria-label="Sort by"><option value="new">Newest first</option><option value="due">Due date</option><option value="pri">Priority</option></select>
</div>
<ul class="list" id="list"></ul>
<p class="empty" id="empty" hidden></p>
<div class="foot"><button class="link" id="clear" type="button">Delete completed tasks</button></div>
</main></div><script src="js/store.js"></script><script src="js/tasks.js"></script></body></html>
