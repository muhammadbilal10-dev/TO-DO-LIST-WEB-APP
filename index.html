<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Dashboard – Taskly</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><aside class="side"><div class="brand"><span class="logo"><svg class="i" viewBox="0 0 24 24" style="stroke:#fff"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>Taskly</b></div><nav aria-label="Main"><a href="index.html" class="on" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z"/></svg><span>Dashboard</span></a><a href="tasks.html"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span>My tasks</span></a></nav><div class="side-foot" id="side-stat"></div></aside><main class="main">
<header class="top"><div><h1 id="hello">Hello</h1><p class="sub" id="date"></p></div><a class="btn" href="tasks.html#new">New task</a></header>
<section class="grid g4" id="stats" aria-label="Summary"></section>
<section class="grid g2">
  <div class="card"><h2>Completed this week</h2><div class="bars" id="week"></div></div>
  <div class="card"><h2>Overall progress</h2><div class="ringwrap"><div class="pct"><svg class="ring" viewBox="0 0 130 130"><circle class="bg" cx="65" cy="65" r="52"/><circle class="fg" id="ring" cx="65" cy="65" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><span id="pct">0%</span></div><p class="sub" id="ringtxt"></p></div></div>
</section>
<section class="grid g3">
  <div class="card"><h2>Upcoming deadlines</h2><ul class="mini" id="up"></ul></div>
  <div class="card"><h2>Open tasks by priority</h2><div id="prio"></div></div>
  <div class="card"><h2>Recently added</h2><ul class="mini" id="recent"></ul></div>
</section>
<section class="card"><h2>Quick add</h2><form class="qa" id="qa" autocomplete="off"><input type="text" id="qt" placeholder="What needs doing?" maxlength="200" aria-label="New task"><button class="btn">Add task</button></form></section>
</main></div><script src="js/store.js"></script><script src="js/dashboard.js"></script></body></html>
